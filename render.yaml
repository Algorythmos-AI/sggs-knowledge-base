# Render Blueprint — STAGING ONLY.
# Production (`sggs-knowledge-base`) is a manually managed service and is
# deliberately NOT declared here: linking this Blueprint must never create or
# adopt a production service. Deploys are triggered by CI (deploy hook) after the
# gates pass, so autoDeploy is off. See docs/process/runbooks/deploy.md.
services:
  - type: web
    name: sggs-api-staging
    runtime: docker
    dockerfilePath: ./webapp/Dockerfile
    dockerContext: .
    branch: integration
    plan: free
    healthCheckPath: /api/meta   # cheap + cached; /api/health runs a full verify pass
    autoDeploy: false
    envVars:
      - key: SGGS_OPEN_BROWSER
        value: "0"
