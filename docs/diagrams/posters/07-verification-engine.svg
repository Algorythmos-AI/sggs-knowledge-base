<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 1100" width="100%" role="img" aria-labelledby="pk-title-verification-engine pk-desc-verification-engine" class="poster-svg" data-poster="verification-engine">
<title id="pk-title-verification-engine">The verification engine</title>
<desc id="pk-desc-verification-engine">The claim is NFC-normalised and its script detected. Gurmukhi claims are cleaned of dandas and numerals; Roman claims are folded with roman_norm. Candidate lines come from the FTS index (an exact phrase, then a looser OR). Each candidate is scored with difflib’s ratio against the claim. The ladder then decides: an exact byte match is VERIFIED_EXACT; a claim contained whole in a line is VERIFIED_PARTIAL; a best ratio of at least 0.95 is VERIFIED; at least 0.85 is PROBABLE, or AMBIGUOUS when the runner-up is within 0.05 and itself at least 0.80; anything lower is NOT_FOUND with no line asserted. A claimed Ang adds +ANG_MATCH or +ANG_MISMATCH with the actual Ang.</desc>
<defs>
  <marker id="pk-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="var(--poster-accent-text, #8A6100)"/></marker>
</defs>
<style>
  .poster-svg { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  .pk-step.is-dim { opacity: 0.22; transition: opacity 240ms ease; }
  .pk-step.is-active rect, .pk-step.is-active ellipse { filter: drop-shadow(0 0 6px var(--poster-accent-fill, #FFBC0D)); }
  @media (prefers-reduced-motion: reduce) { .pk-step.is-dim { transition: none; } }
</style>
