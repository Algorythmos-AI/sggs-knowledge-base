<text x="280" y="386.0" text-anchor="middle" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif' font-size="16" font-weight="500" fill="#201A12">Gurmukhi: text / skeleton · Roman: translit_norm</text><rect x="40" y="440" width="480" height="100" rx="10" fill="var(--poster-paper-warm, #FDF6E3)" stroke="var(--poster-accent, #A87900)" stroke-width="2"/><text x="280" y="473.2" text-anchor="middle" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif' font-size="18" font-weight="500" fill="var(--poster-ink, #201A12)">Score each candidate</text><text x="280" y="496.6" text-anchor="middle" font-family='ui-monospace, "SF Mono", Menlo, Consolas, monospace' font-size="16" font-weight="500" fill="var(--poster-ink, #201A12)">difflib.SequenceMatcher(claim, line).ratio()</text><text x="280" y="520.0" text-anchor="middle" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif' font-size="16" font-weight="500" fill="var(--poster-ink, #201A12)">best · second · gap = best − second</text></g><g id="step-03" data-step="step-03" class="pk-step"><path d="M526.0 490.0 L540.0 490.0 L540.0 240.0 L584.0 240.0" fill="none" stroke="var(--poster-accent-text, #8A6100)" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#pk-arrow)"/><rect x="590" y="200" width="940" height="80" rx="10" fill="var(--poster-positive, #27703F)" stroke="var(--poster-positive, #27703F)" stroke-width="2"/><text x="1060" y="234.9" text-anchor="middle" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif' font-size="18" font-weight="500" fill="#FFFFFF">3 · VERIFIED_EXACT · confidence 1.0</text><text x="1060" y="258.3" text-anchor="middle" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif' font-size="16" font-weight="500" fill="#FFFFFF">after NFC and punctuation stripping, the bytes equal a canonical line</text></g><g id="step-04" data-step="step-04" class="pk-step"><path d="M1060.0 286.0 L1060.0 304.0" fill="none" stroke="var(--poster-accent-text, #8A6100)" stroke-width="2.5" marker-end="url(#pk-arrow)"/><rect x="1101.4" y="281.0" width="37.2" height="28" rx="6" fill="var(--poster-paper, #FBF7F0)" stroke="none"/><text x="1120" y="300.8" text-anchor="middle" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif' font-size="16" font-weight="500" fill="var(--poster-ink, #201A12)">no</text><rect x="590" y="310" width="940" height="80" rx="10" fill="var(--poster-positive, #27703F)" stroke="var(--poster-positive, #27703F)" stroke-width="2"/><text x="1060" y="344.9" text-anchor="middle" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif' font-size="18" font-weight="500" fill="#FFFFFF">4 · VERIFIED_PARTIAL · confidence 0.95</text><text x="1060" y="368.3" text-anchor="middle" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif' font-size="16" font-weight="500" fill="#FFFFFF">the claim (3+ words or 12+ characters) sits whole inside a canonical line</text></g><g id="step-05" data-step="step-05" class="pk-step"><path d="M1060.0 396.0 L1060.0 414.0" fill="none" stroke="var(--poster-accent-text, #8A6100)" stroke-width="2.5" marker-end="url(#pk-arrow)"/><rect x="1101.4" y="391.0" width="37.2" height="28" rx="6" fill="var(--poster-paper, #FBF7F0)" stroke="none"/><text x="1120" y="410.8" text-anchor="middle" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif' font-size="16" font-weight="500" fill="var(--poster-ink, #201A12)">no</text><rect x="590" y="420" width="940" height="80" rx="10" fill="var(--poster-positive, #27703F)" stroke="var(--poster-positive, #27703F)" stroke-width="2"/><text x="1060" y="454.9" text-anchor="middle" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif' font-size="18" font-weight="500" fill="#FFFFFF">5 · VERIFIED · confidence = ratio</text><text x="1060" y="478.3" text-anchor="middle" font-family='ui-monospace, "SF Mono", Menlo, Consolas, monospace' font-size="16" font-weight="500" fill="#FFFFFF">best ratio ≥ 0.95</text><rect x="590" y="770" width="940" height="60" rx="6" fill="var(--poster-paper, #FBF7F0)" stroke="var(--poster-kraft, #B69A81)" stroke-width="1.5"/><text x="1060" y="806.6" text-anchor="middle" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif' font-size="16" font-weight="500" fill="var(--poster-ink, #201A12)">webapp/verify.py: _THRESH_EXACT 0.95 · _THRESH_PROBABLE 0.85 · _THRESH_AMBIG 0.80 · _THRESH_GAP 0.05</text></g><g id="step-06" data-step="step-06" class="pk-step"><path d="M968.0 506.0 L932.0 524.0" fill="none" stroke="var(--poster-accent-text, #8A6100)" stroke-width="2.5" marker-end="url(#pk-arrow)"/><rect x="991.4" y="501.0" width="37.2" height="28" rx="6" fill="var(--poster-paper, #FBF7F0)" stroke="none"/><text x="1010" y="520.8" text-anchor="middle" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif' font-size="16" font-weight="500" fill="var(--poster-ink, #201A12)">no</text><path d="M1152.0 506.0 L1188.0 524.0" fill="none" stroke="var(--poster-accent-text, #8A6100)" stroke-width="2.5" marker-end="url(#pk-arrow)"/><rect x="590" y="530" width="460" height="100" rx="10" fill="var(--poster-paper-warm, #FDF6E3)" stroke="var(--poster-accent, #A87900)" stroke-width="2"/><text x="820" y="563.2" text-anchor="middle" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif' font-size="18" font-weight="500" fill="var(--poster-ink, #201A12)">6 · PROBABLE</text><text x="820" y="586.6" text-anchor="middle" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif' font-size="16" font-weight="500" fill="var(--poster-ink, #201A12)">best ratio ≥ 0.85 and the runner-up</text><text x="820" y="610.0" text-anchor="middle" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif' font-size="16" font-weight="500" fill="var(--poster-ink, #201A12)">is not close: gap ≥ 0.05</text><rect x="1070" y="530" width="460" height="100" rx="10" fill="var(--poster-paper-warm, #FDF6E3)" stroke="var(--poster-accent, #A87900)" stroke-width="2"/><text x="1300" y="563.2" text-anchor="middle" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif' font-size="18" font-weight="500" fill="var(--poster-ink, #201A12)">6 · AMBIGUOUS</text><text x="1300" y="586.6" text-anchor="middle" font-family='ui-monospace, "SF Mono", Menlo, Consolas, monospace' font-size="16" font-weight="500" fill="var(--poster-ink, #201A12)">best ≥ 0.85, second ≥ 0.80, gap &lt; 0.05</text><text x="1300" y="610.0" text-anchor="middle" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif' font-size="16" font-weight="500" fill="var(--poster-ink, #201A12)">two lines fit: the engine will not choose</text></g><g id="step-07" data-step="step-07" class="pk-step"><path d="M932.0 636.0 L968.0 654.0" fill="none" stroke="var(--poster-accent-text, #8A6100)" stroke-width="2.5" marker-end="url(#pk-arrow)"/><rect x="991.4" y="631.0" width="37.2" height="28" rx="6" fill="var(--poster-paper, #FBF7F0)" stroke="none"/><text x="1010" y="650.8" text-anchor="middle" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif' font-size="16" font-weight="500" fill="var(--poster-ink, #201A12)">no</text><path d="M1188.0 636.0 L1152.0 654.0" fill="none" stroke="var(--poster-accent-text, #8A6100)" stroke-width="2.5" marker-end="url(#pk-arrow)"/><path d="M280.0 546.0 L280.0 574.0" fill="none" stroke="var(--poster-accent-text, #8A6100)" stroke-width="2.5" marker-end="url(#pk-arrow)"/><path d="M280.0 686.0 L280.0 714.0" fill="none" stroke="var(--poster-accent-text, #8A6100)" stroke-width=