ance_details: best, second, gap, scored</text><rect x="590" y="660" width="940" height="80" rx="8" fill="var(--poster-negative, #B33528)" stroke="var(--poster-negative, #B33528)" stroke-width="2"/><text x="1060" y="694.9" text-anchor="middle" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif' font-size="18" font-weight="500" fill="#FFFFFF">7 · NOT_FOUND · confidence 0.0</text><text x="1060" y="718.3" text-anchor="middle" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif' font-size="16" font-weight="500" fill="#FFFFFF">best ratio &lt; 0.85, or no candidates — no line is asserted, no percentage misleads</text><rect x="560" y="880" width="1000" height="60" rx="6" fill="var(--poster-paper, #FBF7F0)" stroke="var(--poster-kraft, #B69A81)" stroke-width="1.5"/><text x="1060" y="916.6" text-anchor="middle" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif' font-size="16" font-weight="500" fill="var(--poster-ink, #201A12)">contract/golden_verify.ndjson pins the verdicts; contract_http.py replays them against every deploy</text></g>
