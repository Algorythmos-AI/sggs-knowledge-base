#pk-arrow)"/><path d="M390.0 576.0 L390.0 594.0" fill="none" stroke="var(--poster-accent-text, #8A6100)" stroke-width="2.5" marker-end="url(#pk-arrow)"/><rect x="60" y="290" width="320" height="80" rx="10" fill="var(--poster-paper-warm, #FDF6E3)" stroke="var(--poster-accent, #A87900)" stroke-width="2"/><text x="220" y="324.9" text-anchor="middle" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif' font-size="18" font-weight="500" fill="var(--poster-ink, #201A12)">1 · substitute letters</text><text x="220" y="348.3" text-anchor="middle" font-family='ui-monospace, "SF Mono", Menlo, Consolas, monospace' font-size="16" font-weight="500" fill="var(--poster-ink, #201A12)">w→v · z→j · q→k · x→k</text><rect x="400" y="290" width="320" height="80" rx="10" fill="var(--poster-paper-warm, #FDF6E3)" stroke="var(--poster-accent, #A87900)" stroke-width="2"/><text x="560" y="313.2" text-anchor="middle" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif' font-size="18" font-weight="500" fill="var(--poster-ink, #201A12)">2 · digraphs</text><text x="560" y="336.6" text-anchor="middle" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif' font-size="16" font-weight="500" fill="var(--poster-ink, #201A12)">sh chh ch kh gh jh th dh bh ph rh</text><text x="560" y="360.0" text-anchor="middle" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif' font-size="16" font-weight="500" fill="var(--poster-ink, #201A12)">→ their first letter · f → p</text><rect x="60" y="390" width="320" height="80" rx="10" fill="var(--poster-paper-warm, #FDF6E3)" stroke="var(--poster-accent, #A87900)" stroke-width="2"/><text x="220" y="424.9" text-anchor="middle" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif' font-size="18" font-weight="500" fill="var(--poster-ink, #201A12)">3 · voicing pairs</text><text x="220" y="448.3" text-anchor="middle" font-family='ui-monospace, "SF Mono", Menlo, Consolas, monospace' font-size="16" font-weight="500" fill="var(--poster-ink, #201A12)">b→v · k→g · t→d · p→v</text><rect x="400" y="390" width="320" height="80" rx="10" fill="var(--poster-paper-warm, #FDF6E3)" stroke="var(--poster-accent, #A87900)" stroke-width="2"/><text x="560" y="413.2" text-anchor="middle" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif' font-size="18" font-weight="500" fill="var(--poster-ink, #201A12)">4 · the y glide</text><text x="560" y="436.6" text-anchor="middle" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif' font-size="16" font-weight="500" fill="var(--poster-ink, #201A12)">leading y → j · medial y dropped</text><text x="560" y="460.0" text-anchor="middle" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif' font-size="16" font-weight="500" fill="var(--poster-ink, #201A12)">gyan ~ giaan</text><rect x="60" y="490" width="660" height="80" rx="10" fill="var(--poster-paper-warm, #FDF6E3)" stroke="var(--poster-accent, #A87900)" stroke-width="2"/><text x="390" y="524.9" text-anchor="middle" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif' font-size="18" font-weight="500" fill="var(--poster-ink, #201A12)">5 · vowels and doubles</text><text x="390" y="548.3" text-anchor="middle" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif' font-size="16" font-weight="500" fill="var(--poster-ink, #201A12)">a leading vowel stays; other vowels are dropped; doubled letters collapse</text><rect x="60" y="600" width="660" height="80" rx="10" fill="var(--poster-positive, #27703F)" stroke="var(--poster-positive, #27703F)" stroke-width="2"/><text x="390" y="634.9" text-anchor="middle" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif' fon