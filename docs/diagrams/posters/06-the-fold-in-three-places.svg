<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 960" width="100%" role="img" aria-labelledby="pk-title-the-fold-in-three-places pk-desc-the-fold-in-three-places" class="poster-svg" data-poster="the-fold-in-three-places">
<title id="pk-title-the-fold-in-three-places">The fold in three places</title>
<desc id="pk-desc-the-fold-in-three-places">Seekers spell the same word many ways. roman_norm folds a Roman word in five steps — letter substitutions, digraphs, voicing pairs, the y glide, vowels dropped and doubles collapsed — into a key such as vhgr. The data repository applies it when it builds the translit_norm column; the platform applies it at query time in search and verification; the iOS app carries a Swift port. The contract file golden_roman_norm.ndjson records 24,719 input and output pairs generated from the platform, and every repository asserts against it.</desc>
<defs>
  <marker id="pk-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="var(--poster-accent-text, #8A6100)"/></marker>
</defs>
