name: Feature request
description: Propose a change or new capability.
labels: ["type/feature"]
body:
  - type: textarea
    id: problem
    attributes: { label: Problem / motivation }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposed solution }
  - type: textarea
    id: acceptance
    attributes: { label: Acceptance criteria, description: "Definition of Ready — bullet the checks that mean done." }
