name: release
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: release-main
  cancel-in-progress: false
jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Derive version + release notes from the repo
        id: v
        run: |
          VERSION=$(python3 -c "import re;print(re.search(r\"APP_VERSION\s*=\s*'([^']+)'\", open('webapp/serve.py').read()).group(1))")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
          python3 - "$VERSION" > RELEASE_NOTES.md <<'PY'
          import re, sys
          v=sys.argv[1]; s=open('CHANGELOG.md',encoding='utf-8').read()
          m=re.search(rf'(## \[{re.escape(v)}\].*?)(?=\n## \[)', s, re.S)
          print(m.group(1).strip() if m else f'v{v}')
          PY
      - name: Create tag + GitHub Release (only if the tag is new)
        if: steps.v.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
        run: |
          git tag -a "v$V" -m "v$V"
          git push origin "v$V"
          gh release create "v$V" --title "v$V" --notes-file RELEASE_NOTES.md --verify-tag
      - name: Back-merge main → integration (keep trunk current)
        if: steps.v.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create --base integration --head main \
            --title "chore: back-merge main into integration (v${{ steps.v.outputs.version }})" \
            --body "Automated back-merge after the release tag. Keeps the trunk current." || \
            echo "back-merge PR already exists or nothing to merge"
