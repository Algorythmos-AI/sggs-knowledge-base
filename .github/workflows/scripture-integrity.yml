name: scripture-integrity
# Runs on EVERY PR (not path-filtered): it is a required check, and a required
# check that is skipped stays "Expected — waiting for status" and blocks the PR
# forever. The job is cheap and passes trivially when the pin is unchanged.
#
# The scripture database is owned by Algorythmos-AI/sggs-data, whose CI runs the data gates
# (reconcile attestation, regroup invariants, scripture guard, editorial ledger, fingerprints).
# Here we prove this repository consumes exactly the object that repository publishes.
on:
  pull_request:
  push:
    branches: [integration, main]
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"
      - name: Dataset pin — the lock and contract/_meta.json name the same object; sggs-data publishes it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/data/fetch_dataset.py --check-repo
          python3 scripts/data/fetch_dataset.py --check-pin
      - uses: ./.github/actions/fetch-dataset
      - name: The installed database opens, passes SQLite integrity and matches the corpus invariants
        run: |
          python3 - <<'PY'
          import sqlite3, sys
          con = sqlite3.connect("file:db/sggs.sqlite?mode=ro&immutable=1", uri=True)
          ok = con.execute("PRAGMA quick_check").fetchone()[0] == "ok"
          lines = con.execute("SELECT COUNT(*) FROM lines").fetchone()[0]
          angs = con.execute("SELECT COUNT(DISTINCT ang), MIN(ang), MAX(ang) FROM lines").fetchone()
          fails = []
          if not ok: fails.append("PRAGMA quick_check failed")
          if lines != 60658: fails.append(f"lines = {lines}, expected 60658")
          if tuple(angs) != (1430, 1, 1430): fails.append(f"Angs = {angs}, expected 1430 contiguous")
          for f in fails:
              print("::error::" + f)
          if fails:
              sys.exit(1)
          print("database OK: quick_check, 60,658 lines, Angs 1–1430")
          PY
