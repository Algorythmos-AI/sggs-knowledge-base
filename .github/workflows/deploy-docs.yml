name: deploy-docs
# The wiki (docs-site/ over docs/). On every PR: the docs gates, the build (Mermaid rendered, links
# validated), unit + e2e + accessibility tests and the performance budgets. On a push to integration:
# deploy to the docs staging alias; on a push to main: build, deploy unaliased, smoke, promote to
# docs.gurbanisoul.com, smoke again, roll back on failure; every production failure opens an issue.
# Nightly: the docs job alone on integration, to catch drift from outside the repository (npm,
# Starlight, the sibling repositories, the dataset) while no pull request is open.
# CI-gated like the product (ADR-0005, ADR-0012); the Vercel project's own git deployments are off.
# Runbooks: docs/process/runbooks/deploy.md, docs/process/runbooks/docs-site.md.
on:
  pull_request:
  push:
    branches: [integration, main]
  schedule:
    - cron: "17 16 * * *"   # nightly, 16:17 UTC (02:17 in Sydney)
  workflow_dispatch:

concurrency:
  # the event is part of the group: a nightly or manual run must never cancel a push run's deploy
  group: docs-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  VERCEL_CLI: vercel@59.7.0
  DOCS_STAGING: https://sggs-docs-staging.vercel.app
  DOCS_PROD: https://docs.gurbanisoul.com

jobs:
  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }   # last-updated dates and verified-stamp staleness need history
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version-file: ".python-version" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version-file: ".nvmrc", cache: npm, cache-dependency-path: docs-site/package-lock.json }
      - name: Sibling docs are pinned consistently and installed at their commits
        env: { GH_TOKEN: "${{ secrets.SGGS_READ_TOKEN || github.token }}" }
        run: |
          python3 tools/fetch_sibling_docs.py --check
          python3 tools/fetch_sibling_docs.py
      - name: The pinned database (cited scripture on the wiki is verified against it)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .dataset-cache
          key: dataset-${{ hashFiles('dataset.lock.json') }}
      - env: { GH_TOKEN: "${{ secrets.SGGS_READ_TOKEN || github.token }}" }
        run: python3 scripts/data/fetch_dataset.py --cache-dir .dataset-cache
      - name: Source-level docs gates (frontmatter, links, widgets, Mermaid palette, scripture rule, posters, site config)
        run: |
          python3 tools/docs_check.py
          python3 tools/gen_route_table.py --check
          python3 tools/gen_contributors.py --check
          GH_TOKEN="${{ secrets.SGGS_READ_TOKEN || github.token }}" python3 tools/gen_repo_map.py --check
          python3 scripts/brand/contrast_report.py --check
      - name: Tool tests
        run: python3 -m unittest discover -s tools/tests -v
      - name: Install
        working-directory: docs-site
        run: npm ci
      - name: Playwright Chromium (renders Mermaid at build; runs the e2e suite)
        working-directory: docs-site
        run: npx playwright install --with-deps chromium
      - name: Plugin unit tests
        working-directory: docs-site
        run: npm run test:unit
      - name: Every committed poster equals its spec
        working-directory: docs-site
        run: node scripts/build-posters.mjs --check
      - name: Types
        working-directory: docs-site
        run: npm run typecheck
      - name: Build (every Mermaid fence rendered)
        working-directory: docs-site
        env: { PUBLIC_DOCS_COMMIT: "${{ github.sha }}" }
        run: npm run build
      - name: The built site is whole (render, Mermaid, links, budgets, CSP hashes) — the same as make docs
        working-directory: docs-site
        run: npm run check:all
      - name: End-to-end + accessibility (mocked API, served with the production headers and CSP)
        working-directory: docs-site
        run: npm run test:e2e
      - name: Lighthouse budgets (five pages on a pull request or staging push; all twenty nightly and on main)
        # Lighthouse was two-thirds of this job (20 pages x 3 runs, ~12 minutes). A pull request needs
        # the pages that stress the budget — the home page, the heaviest page, a poster, a live widget,
        # the largest table — and the nightly run and every push to main still audit all twenty.
        working-directory: docs-site
        env:
          FULL: ${{ github.event_name == 'schedule' || github.ref == 'refs/heads/main' }}
        run: |
          if [ "$FULL" = "true" ]; then
            npm run lhci
          else
            npm run lhci -- \
              --collect.url=http://localhost/index.html \
              --collect.url=http://localhost/architecture/overview/index.html \
              --collect.url=http://localhost/scripture/structure/index.html \
              --collect.url=http://localhost/data/line-record/index.html \
              --collect.url=http://localhost/glossary/index.html
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: docs-dist-and-reports
          path: |
            docs-site/dist
            docs-site/playwright-report
            docs-site/.lighthouseci
          retention-days: 7

  nightly-alert:
    name: nightly-alert
    # one issue while the nightly build is red; closed by the next green night
    if: always() && github.event_name == 'schedule'
    needs: docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.docs.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="docs: nightly wiki build failing"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')"
          if [ "$RESULT" = "success" ]; then
            if [ -n "$existing" ]; then gh issue close "$existing" --repo "$GITHUB_REPOSITORY" --comment "Green again: $RUN_URL"; fi
            exit 0
          fi
          body="The nightly docs job on integration ($GITHUB_SHA) ended: $RESULT. Nothing in this repository changed since the last green run, so look outside it first: an npm or Starlight release, a sibling repository's docs (tools/fetch_sibling_docs.py --check), the dataset pin. Run: $RUN_URL"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label documentation --body "$body"
          fi

  deploy-staging:
    name: deploy-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/integration'
    needs: docs
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 25
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_DOCS_PROJECT_ID }}
    steps:
      - name: Required docs secrets present
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_DOCS_PROJECT_ID: ${{ secrets.VERCEL_DOCS_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_DOCS_PROJECT_ID" ]; then
            echo "::error::missing VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_DOCS_PROJECT_ID in the staging environment (docs/process/runbooks/deploy.md)"; exit 1
          fi
          echo "all docs secrets present"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version-file: ".python-version" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version-file: ".nvmrc", cache: npm, cache-dependency-path: docs-site/package-lock.json }
      - name: Staging must never be the project's first deployment
        # The project's first deployment became its production deployment although CI deployed it as
        # a preview: that is how integration reached docs.gurbanisoul.com on 2026-09-26. Never again.
        env: { VERCEL_TOKEN: "${{ secrets.VERCEL_TOKEN }}" }
        run: |
          if python3 scripts/ci/vercel_api.py has-production; then
            echo "the docs project has a production deployment; a staging deploy stays a preview"
          else
            rc=$?
            if [ "$rc" = 1 ]; then
              echo "::error::the docs project has no production deployment yet, and Vercel would make this staging build production. Release to main first (deploy-production), per docs/process/runbooks/docs-site.md."
            fi
            exit 1
          fi
      - run: npm i -g "$VERCEL_CLI"
      - env: { GH_TOKEN: "${{ secrets.SGGS_READ_TOKEN || github.token }}" }
        run: python3 tools/fetch_sibling_docs.py
      - working-directory: docs-site
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Build, deploy (preview) and alias to the docs staging domain
        working-directory: docs-site
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PUBLIC_DOCS_COMMIT: ${{ github.sha }}
        run: |
          vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          vercel build --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --archive=tgz --format=json --token="$VERCEL_TOKEN" > deploy.out 2> deploy.err || { cat deploy.err; exit 1; }
          cat deploy.err
          url=$(python3 ../scripts/ci/vercel_deploy_url.py deploy.out deploy.err)
          echo "deployed $url"
          target=$(python3 ../scripts/ci/vercel_api.py target "$url")
          if [ "$target" != "preview" ]; then
            echo "::error::the staging deployment $url has target '$target', not preview: integration must never reach production"; exit 1
          fi
          vercel alias set "$url" sggs-docs-staging.vercel.app --token="$VERCEL_TOKEN"
      - name: Smoke the staging wiki by commit
        env: { VERCEL_DOCS_BYPASS_SECRET: "${{ secrets.VERCEL_DOCS_BYPASS_SECRET }}" }
        run: python3 scripts/ci/docs_smoke.py "$DOCS_STAGING" --commit "$GITHUB_SHA"
      - name: The live suite against staging (real API, the deployed headers and CSP)
        working-directory: docs-site
        env:
          DOCS_LIVE_URL: ${{ env.DOCS_STAGING }}
          VERCEL_BYPASS: ${{ secrets.VERCEL_DOCS_BYPASS_SECRET }}
        run: npx playwright test -c playwright.live.config.ts

  deploy-production:
    name: deploy-production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docs
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_DOCS_PROJECT_ID }}
    steps:
      - name: Required docs secrets present
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_DOCS_PROJECT_ID: ${{ secrets.VERCEL_DOCS_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_DOCS_PROJECT_ID" ]; then
            echo "::error::missing VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_DOCS_PROJECT_ID in the production environment (docs/process/runbooks/deploy.md)"; exit 1
          fi
          echo "all docs secrets present"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version-file: ".python-version" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version-file: ".nvmrc", cache: npm, cache-dependency-path: docs-site/package-lock.json }
      - run: npm i -g "$VERCEL_CLI"
      - env: { GH_TOKEN: "${{ secrets.SGGS_READ_TOKEN || github.token }}" }
        run: python3 tools/fetch_sibling_docs.py
      - working-directory: docs-site
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Record the deployment serving docs.gurbanisoul.com (the rollback target)
        # the deployment the domain serves now, not the newest READY production deployment: a build
        # deployed --skip-domain whose smoke failed is READY and production too, but never served
        id: prev
        env: { VERCEL_TOKEN: "${{ secrets.VERCEL_TOKEN }}" }
        run: |
          rc=0; prev=$(python3 scripts/ci/vercel_api.py live "$DOCS_PROD") || rc=$?
          if [ "$rc" = 3 ]; then prev=""; elif [ "$rc" != 0 ]; then echo "::error::cannot read the live docs deployment"; exit 1; fi
          echo "serving docs.gurbanisoul.com now: ${prev:-nothing}"
          echo "previous=$prev" >> "$GITHUB_OUTPUT"
      - name: Build + deploy (production target, NOT aliased yet)
        id: deploy
        working-directory: docs-site
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PUBLIC_DOCS_COMMIT: ${{ github.sha }}
        run: |
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          if ! vercel deploy --prebuilt --prod --skip-domain --format=json --token="$VERCEL_TOKEN" > deploy.out 2> deploy.err; then
            cat deploy.err; cat deploy.out; echo "::error::vercel deploy failed"; exit 1
          fi
          cat deploy.err
          url=$(python3 ../scripts/ci/vercel_deploy_url.py deploy.out deploy.err)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "built $url (not live)"
      - name: Smoke the unaliased deployment by commit
        env: { VERCEL_DOCS_BYPASS_SECRET: "${{ secrets.VERCEL_DOCS_BYPASS_SECRET }}" }
        run: python3 scripts/ci/docs_smoke.py "${{ steps.deploy.outputs.url }}" --commit "$GITHUB_SHA"
      - name: Promote to docs.gurbanisoul.com and smoke the public domain
        id: promote
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          vercel promote "$URL" --yes --timeout 5m --token="$VERCEL_TOKEN"
          python3 scripts/ci/docs_smoke.py "$DOCS_PROD" --commit "$GITHUB_SHA"
      - name: Roll back (the public smoke failed after promotion)
        id: rollback
        if: failure() && steps.promote.outcome == 'failure' && steps.prev.outputs.previous != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PREV: ${{ steps.prev.outputs.previous }}
        run: vercel rollback "$PREV" --yes --timeout 5m --token="$VERCEL_TOKEN"
      - name: Open an incident issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTE: ${{ steps.promote.outcome }}
          ROLLBACK: ${{ steps.rollback.outcome }}
          PREV: ${{ steps.prev.outputs.previous }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          sha7=${GITHUB_SHA::7}
          if [ "$PROMOTE" != "failure" ]; then
            title="Docs deploy failed before promotion — production unchanged ($sha7)"
          elif [ "$ROLLBACK" = "success" ]; then
            title="Docs production rolled back to $PREV after a failed public smoke ($sha7)"
          elif [ -z "$PREV" ]; then
            title="Docs production failed its public smoke and had nothing to roll back to ($sha7)"
          else
            title="Docs production rollback FAILED after a failed public smoke ($sha7)"
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
            --body "Run: $RUN_URL · rollback target: ${PREV:-none} · runbook: docs/process/runbooks/docs-site.md#4-rollback"

  main-guard:
    name: main-guard
    # a push to main whose docs job did not succeed never reaches deploy-production: say so loudly
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.docs.result != 'success'
    needs: docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.docs.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Docs production deploy skipped: the docs check was $RESULT on main (${GITHUB_SHA::7})" \
            --body "docs.gurbanisoul.com still serves the previous release. Fix forward through integration, then release. Run: $RUN_URL"
