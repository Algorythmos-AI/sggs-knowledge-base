name: version-consistency
on:
  pull_request:
  push:
    branches: [integration, main]
permissions:
  contents: read
jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - run: python3 scripts/release/check_versions.py
      - name: main only accepts release from integration/hotfix
        if: github.base_ref == 'main'
        run: |
          echo "PR into main from '${{ github.head_ref }}'"
          case "${{ github.head_ref }}" in
            integration|hotfix/*) echo "source branch OK" ;;
            *) echo "::error::main only accepts PRs from integration or hotfix/*"; exit 1 ;;
          esac
