name: iOS fidelity gate

# Two independent gates on every push / PR:
#   parity — the Swift search/verify/reader/analytics core stays byte-for-byte with the
#            Python backend, on the VENDORED SQLite 3.51.0 (the engine the app ships),
#            for BOTH DB profiles (personal incl. English/timing; public Gurmukhi-only).
#   app    — the SGGS app target builds and its unit + UI tests pass on a simulator.
# Keeping them separate makes a kit-parity failure distinguishable from an app failure.

on:
  push:
    branches: ["**"]
    paths:
      - "ios/**"
      - "contract/**"
      - "pipeline/build_ios_db.py"
      - "pipeline/banis/**"                     # Nitnem registry feeds the bundled DB
      - "pipeline/gen_golden_vectors.py"
      - "pipeline/check_release_license.sh"
      - "frontend/src/scripts/pahar.js"          # source of the golden_pahar contract
      - "frontend/public/contributors.json"      # bundled into the app (Lineage roster)
      - ".github/workflows/ios.yml"
  pull_request:
  workflow_dispatch:

jobs:
  parity:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/lfs-db
      - name: Build the bundled (personal-profile) iOS DB from the source (deterministic)
        run: python3 pipeline/build_ios_db.py --profile personal
      - name: Build the public (Gurmukhi-only) profile for the degradation-parity gate
        run: python3 pipeline/build_ios_db.py --profile public
      - name: Verify the iOS DB matches its certified manifest (db_sha256)
        run: |
          EXPECTED=$(python3 -c "import json;print(json.load(open('ios/Resources/sggs-ios.manifest.json'))['db_sha256'])")
          ACTUAL=$(shasum -a 256 ios/Resources/sggs-ios.sqlite | cut -d' ' -f1)
          echo "expected=$EXPECTED actual=$ACTUAL"
          test "$EXPECTED" = "$ACTUAL"
      - name: Kit parity tests on the vendored SQLite 3.51.0 (the fidelity gate)
        run: swift test --package-path ios/Packages/GurbaniSearchKit
      - name: Release-readiness gate (NOTICE.md hard-gate)
        run: |
          # the PUBLIC artifact must always pass
          pipeline/check_release_license.sh
          # the PERSONAL (English-bundled) artifact must be BLOCKED without a licence
          # attestation (negative test, independent of the committed attestation flag) …
          if SGGS_LICENSE_ATTESTATION=/dev/null pipeline/check_release_license.sh ios/Resources/sggs-ios.manifest.json; then
            echo "ERROR: the personal manifest passed the gate with no licence attestation"; exit 1
          fi
          echo "personal profile correctly blocked without an attestation"
          # … and must PASS once the licence is attested (positive test, temp file only)
          printf 'LICENSED: true\n' > "$RUNNER_TEMP/attest.md"
          SGGS_LICENSE_ATTESTATION="$RUNNER_TEMP/attest.md" pipeline/check_release_license.sh ios/Resources/sggs-ios.manifest.json
          echo "personal profile correctly released by an attestation"

  # The app target: unit tests (integration + launch-cache) and XCUITests on a simulator.
  # The xcodeproj is generated (not committed); the DB is rebuilt deterministically per job.
  app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/lfs-db
      - name: Build the bundled (personal-profile) iOS DB
        run: python3 pipeline/build_ios_db.py --profile personal
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate SGGS.xcodeproj
        run: xcodegen generate --spec ios/App/project.yml --project ios/App
      - name: Committed Info.plists match the spec (version keys can't silently drift)
        run: |
          git diff --exit-code -- ios/App/Tests/UI/Info.plist ios/App/Widgets/Info.plist \
            || { echo "::error::a committed Info.plist differs from what XcodeGen generates — commit the regenerated file"; exit 1; }
      - name: Resolve an available iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          devs=[dev for k in sorted(d, reverse=True) for dev in d[k]
                if dev.get('isAvailable') and dev['name'].startswith('iPhone')]
          print(devs[0]['udid'])")
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
      - name: Build for testing
        run: |
          xcodebuild build-for-testing -project ios/App/SGGS.xcodeproj -scheme SGGS \
            -destination "id=$SIM_UDID" CODE_SIGNING_ALLOWED=NO | tail -40
      - name: Unit tests (SGGSTests)
        run: |
          xcodebuild test-without-building -project ios/App/SGGS.xcodeproj -scheme SGGS \
            -destination "id=$SIM_UDID" -only-testing:SGGSTests \
            -test-timeouts-enabled YES -resultBundlePath "$RUNNER_TEMP/unit.xcresult" \
            CODE_SIGNING_ALLOWED=NO | tail -60
      - name: UI tests (SGGSUITests)
        run: |
          xcodebuild test-without-building -project ios/App/SGGS.xcodeproj -scheme SGGS \
            -destination "id=$SIM_UDID" -only-testing:SGGSUITests \
            -test-timeouts-enabled YES -resultBundlePath "$RUNNER_TEMP/uitests.xcresult" \
            CODE_SIGNING_ALLOWED=NO | tail -80
      # A UI-test failure otherwise shows only the last 80 log lines and no artifact — upload the
      # result bundles so a failure is actually diagnosable (screenshots, per-test logs).
      - name: Upload test result bundles
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: |
            ${{ runner.temp }}/unit.xcresult
            ${{ runner.temp }}/uitests.xcresult
          if-no-files-found: ignore
          retention-days: 7
