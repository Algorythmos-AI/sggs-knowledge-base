name: docs-freshness
# Weekly: which wiki pages stand on code that changed since someone last read them against it?
# Every process, engineering and architecture page (and others that opt in) carries a `verified`
# stamp; `tools/docs_check.py --freshness` lists the pages whose cited files — code excerpts, linked
# source files, the "Source of truth" of their posters — changed after the stamp, then the pages
# simply far behind. One issue, rewritten each week, closed when every page is fresh. A report,
# never a gate: re-read the page, fix what drifted, move its stamp.
on:
  schedule:
    - cron: "7 7 * * 1"   # Monday 07:07 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: docs-freshness
  cancel-in-progress: false

jobs:
  report:
    name: report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }   # stamps are commits; the report walks history
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version-file: ".python-version" }
      - name: The pages to re-verify
        run: python3 tools/docs_check.py --freshness "$RUNNER_TEMP/fresh.md"
      - name: Rewrite, open or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="docs: wiki pages to re-verify"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')"
          if [ ! -s "$RUNNER_TEMP/fresh.md" ]; then
            if [ -n "$existing" ]; then gh issue close "$existing" --repo "$GITHUB_REPOSITORY" --comment "Every stamped page is fresh. $RUN_URL"; fi
            echo "every stamped page is fresh"; exit 0
          fi
          printf '\n\nRun: %s\n' "$RUN_URL" >> "$RUNNER_TEMP/fresh.md"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/fresh.md"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label documentation --body-file "$RUNNER_TEMP/fresh.md"
          fi
