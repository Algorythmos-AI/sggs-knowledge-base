name: security
on:
  pull_request:
  push:
    branches: [integration, main]
  schedule:
    - cron: "0 6 * * 1"   # Monday full history scan
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: ${{ github.event_name == 'schedule' && 0 || 1 }}
      - name: gitleaks (open-source binary — no org license needed)
        run: |
          V=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --source . --no-git --redact --no-banner --config .gitleaks.toml --exit-code 1
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"
      - name: bandit (python)
        run: |
          pip install bandit
          bandit -r webapp pipeline -ll || true
      - name: semgrep (OSS rulesets)
        uses: returntocorp/semgrep-action@v1
        with:
          config: "p/python p/javascript p/secrets"
        continue-on-error: true
      - name: actionlint (workflow files)
        uses: raven-actions/actionlint@v2
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
      - working-directory: frontend
        run: npm audit --audit-level=high
      - working-directory: docs-site
        run: npm audit --audit-level=high
