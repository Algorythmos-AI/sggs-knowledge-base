name: deploy-verify
# Health-checks Vercel PREVIEW deployments (feature branches). Production (and staging)
# are verified end-to-end by their gated deploy workflows, so they are excluded here.
# Previews sit behind Vercel Deployment Protection (a 302 to login), so this needs a
# REPO-level secret VERCEL_AUTOMATION_BYPASS_SECRET (environment secrets aren't readable
# here, and giving this job an environment would emit deployment events that re-trigger
# it). Without the secret it posts a notice and passes instead of failing on the redirect.
on:
  deployment_status:
permissions:
  contents: read
jobs:
  verify:
    if: github.event.deployment_status.state == 'success' && github.event.deployment_status.environment_url != '' && github.event.deployment_status.environment != 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Health through the preview URL
        env:
          URL: ${{ github.event.deployment_status.environment_url }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          if [ -z "$BYPASS" ]; then
            echo "::notice::Preview $URL is behind Vercel Deployment Protection and no repo-level VERCEL_AUTOMATION_BYPASS_SECRET is set; skipping (see docs/process/runbooks/deploy.md)."
            exit 0
          fi
          code=000
          for _ in $(seq 1 10); do
            code=$(curl -s -o /tmp/h.json -w '%{http_code}' --max-time 20 -H "x-vercel-protection-bypass: $BYPASS" "$URL/api/health" || true)
            [ "$code" = "200" ] && break
            echo "/api/health -> $code (retrying)"; sleep 15
          done
          if [ "$code" != "200" ]; then echo "::error::preview /api/health returned $code"; exit 1; fi
          python3 -c "import json; d=json.load(open('/tmp/h.json')); assert d.get('ok') is True and all(d['checks'].values()), d; print('preview healthy; api version', d.get('version'))"
