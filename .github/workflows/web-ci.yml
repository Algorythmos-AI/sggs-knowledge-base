name: web-ci
on:
  pull_request:
  push:
    branches: [integration, main]
concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/fetch-dataset
        with: { token: "${{ secrets.SGGS_READ_TOKEN || github.token }}" }
      - uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"
      - name: Ruff (bug-only lint gate)
        run: |
          pip install ruff==0.9.10
          ruff check .
          ruff format --check . || echo "::warning::ruff format has suggestions (not gated yet — see pyproject.toml)"
      - name: Unit tests — platform (webapp/tests)
        run: |
          python3 -m unittest discover -s webapp/tests -v
      - name: Health + shabad heading regression
        run: |
          (cd webapp && SGGS_OPEN_BROWSER=0 SGGS_PORT=7777 python3 serve.py &) ; sleep 3
          curl -sf http://127.0.0.1:7777/api/health | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['ok'] and all(d['checks'].values()), d; print('health OK', d['version'])"
          python3 tools/api_superset_check.py --db db/sggs.sqlite --url http://127.0.0.1:7777 --sample 200
          python3 tools/contract_http.py --base http://127.0.0.1:7777   # golden contract over HTTP
      - name: Search harnesses (sampled)
        run: |
          python3 tools/roundtrip_harness.py || true
          python3 tools/casual_quote_harness.py
      - name: Contract drift (regenerated golden vectors must match committed)
        run: |
          python3 tools/gen_golden_vectors.py
          # Gate on the vectors themselves; contract/_meta.json only records the
          # generating python/sqlite versions, which legitimately differ per env.
          if ! git diff --exit-code -- 'contract/*.ndjson'; then
            echo "::error::contract vectors are stale - regenerate with gen_golden_vectors.py and commit"
            exit 1
          fi
  api-image:
    # Builds the exact image Render builds and proves it boots healthy with the commit
    # baked in — a broken Dockerfile or dataset pin fails here, not in production. The image
    # is built BEFORE the runner has the database, so it must obtain the pin by itself; the
    # runner copy is installed afterwards only because contract_http reads it for expectations.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Build the production API image
        run: docker build -f webapp/Dockerfile --build-arg RENDER_GIT_COMMIT="$GITHUB_SHA" -t sggs-api:ci .
      - uses: ./.github/actions/fetch-dataset
        with: { token: "${{ secrets.SGGS_READ_TOKEN || github.token }}" }
      - name: Run it and verify health + baked commit identity
        run: |
          docker run -d -p 7777:7777 -e PORT=7777 --name sggs sggs-api:ci
          for _ in $(seq 1 45); do curl -sf -o /dev/null http://127.0.0.1:7777/api/meta && break; sleep 2; done
          python3 scripts/ci/wait_for_deploy.py http://127.0.0.1:7777 --commit "$GITHUB_SHA" --timeout 120 --interval 3 --unknown-grace 0
          python3 tools/contract_http.py --base http://127.0.0.1:7777   # the shipped image honours the contract
      - name: One service from the same image (SGGS_MODULES=knowledge cuts its slice at build time)
        run: |
          docker build -f webapp/Dockerfile --build-arg RENDER_GIT_COMMIT="$GITHUB_SHA" --build-arg SGGS_MODULES=knowledge -t sggs-api:knowledge .
          docker run -d -p 7778:7777 -e PORT=7777 --name sggs-knowledge sggs-api:knowledge
          for _ in $(seq 1 45); do curl -sf -o /dev/null http://127.0.0.1:7778/readyz && break; sleep 2; done
          curl -sf http://127.0.0.1:7778/readyz | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['ready'] and d['contexts'] == ['knowledge'], d; print('knowledge service ready:', d['contexts'])"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7778/api/timing/clock)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7778/api/ang/1)" = 404   # another service's route
          docker run --rm --entrypoint sh sggs-api:knowledge -c 'ls -l /app/db && test "$(stat -c %s /app/db/sggs.sqlite)" -lt 5000000'
      - name: Container logs
        if: always()
        run: docker logs sggs 2>&1 | tail -20 || true
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npx astro check || true   # informational until types are clean
          npm run build
          npm run test:pahar
