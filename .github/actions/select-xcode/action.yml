name: select-xcode
description: >
  Select the newest installed Xcode at or above the App Store floor, and fail if the runner image
  has none. App Store Connect has required Xcode 26 / the iOS 26 SDK for uploads since 2026-04-28;
  CI must build and test with the SDK that ships, not whatever the image defaults to.
inputs:
  min-major:
    description: Lowest acceptable Xcode major version
    default: "26"
runs:
  using: composite
  steps:
    - shell: bash
      env:
        MIN_MAJOR: ${{ inputs.min-major }}
      run: |
        XCODE=""
        for app in /Applications/Xcode_*.app; do
          major="${app##*/Xcode_}"; major="${major%%.*}"
          case "$major" in *[!0-9]*|"") continue ;; esac
          if [ "$major" -ge "$MIN_MAJOR" ]; then XCODE="$app"; fi   # the glob sorts ascending: last match = newest
        done
        test -n "$XCODE" || { echo "::error::no Xcode $MIN_MAJOR+ on this runner image — move runs-on to an image that has it"; exit 1; }
        sudo xcode-select -s "$XCODE"
        xcodebuild -version
        xcodebuild -showsdks | grep -i 'iphonesimulator' || true
