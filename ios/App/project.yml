name: SGGS
options:
  bundleIdPrefix: org.sggs
  deploymentTarget: { iOS: "17.0" }
  developmentLanguage: pa
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: "NO"
packages:
  GurbaniSearchKit:
    path: ../Packages/GurbaniSearchKit
targets:
  SGGS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        excludes: ["Info.plist"]
      - path: ../Resources/sggs-ios.sqlite
        buildPhase: resources
      - path: ../Resources/sggs-ios.manifest.json
        buildPhase: resources
    dependencies:
      - package: GurbaniSearchKit
        product: GurbaniSearchKit
      - package: GurbaniSearchKit
        product: GurbaniDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.sggs.app
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
  SGGSTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/Unit]
    dependencies:
      - target: SGGS
      - package: GurbaniSearchKit
        product: GurbaniDB
      - package: GurbaniSearchKit
        product: GurbaniSearchKit
    settings:
      base: { PRODUCT_BUNDLE_IDENTIFIER: org.sggs.app.tests }
  SGGSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/UI]
    dependencies: [target: SGGS]
    settings:
      base: { PRODUCT_BUNDLE_IDENTIFIER: org.sggs.app.uitests }
schemes:
  SGGS:
    build:
      targets: { SGGS: all }
    test:
      targets: [SGGSTests, SGGSUITests]
      gatherCoverageData: false
