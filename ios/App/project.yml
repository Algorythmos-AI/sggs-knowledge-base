name: SGGS
options:
  bundleIdPrefix: org.sggs
  deploymentTarget: { iOS: "17.0" }
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.1.4"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: "NO"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
packages:
  GurbaniSearchKit:
    path: ../Packages/GurbaniSearchKit
targets:
  SGGS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Shared
      - path: Resources
        excludes: ["Info.plist"]
      - path: ../Resources/sggs-ios.sqlite
        buildPhase: resources
      - path: ../Resources/sggs-ios.manifest.json
        buildPhase: resources
      - path: ../../frontend/public/contributors.json
        buildPhase: resources
    dependencies:
      - package: GurbaniSearchKit
        product: GurbaniSearchKit
      - package: GurbaniSearchKit
        product: GurbaniDB
      - target: SGGSWidgets
        embed: true
    entitlements:
      path: SGGS.entitlements
      properties:
        com.apple.security.application-groups: [group.org.sggs]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.sggs.app
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
      configs:
        # Release = the archive/TestFlight configuration. Fill DEVELOPMENT_TEAM with the
        # Apple Developer Team ID once membership is active; Automatic signing then
        # creates the App ID + App Group (group.org.sggs) profiles. Debug/CI stay unsigned
        # (CI passes CODE_SIGNING_ALLOWED=NO on the command line, which wins).
        Release:
          CODE_SIGNING_ALLOWED: "YES"
          CODE_SIGN_STYLE: Automatic
          DEVELOPMENT_TEAM: ""
  # WidgetKit extension: links ONLY the dependency-free GurbaniPahar product + the shared
  # snapshot store — never CSQLite or the 100 MB corpus DB. Entitlements are inert on the
  # simulator (CI stays green with CODE_SIGNING_ALLOWED NO); device installs need signing.
  SGGSWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
      # The Hukam widget typesets Gurmukhi — the extension must bundle+register the scripture
      # font itself (extensions don't inherit the app's resources; without this it silently
      # falls back to SF). PrivacyInfo ships in every distributable target.
      - path: Resources/SantLipi.ttf
        buildPhase: resources
      - path: Resources/SourceSerif4.ttf
        buildPhase: resources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: GurbaniSearchKit
        product: GurbaniPahar
    entitlements:
      path: Widgets/SGGSWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.org.sggs]
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Gurbani Soul
        # Must track the app's MARKETING_VERSION — App Store validation rejects an extension
        # whose CFBundleShortVersionString differs from the containing app.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts: [SantLipi.ttf, SourceSerif4.ttf]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.sggs.app.widgets
      configs:
        Release:                      # must match the app target (same team, same App Group)
          CODE_SIGNING_ALLOWED: "YES"
          CODE_SIGN_STYLE: Automatic
          DEVELOPMENT_TEAM: ""
  SGGSTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/Unit]
    dependencies:
      - target: SGGS
      - package: GurbaniSearchKit
        product: GurbaniDB
      - package: GurbaniSearchKit
        product: GurbaniSearchKit
    settings:
      base: { PRODUCT_BUNDLE_IDENTIFIER: org.sggs.app.tests }
  SGGSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/UI]
    dependencies: [target: SGGS]
    settings:
      base: { PRODUCT_BUNDLE_IDENTIFIER: org.sggs.app.uitests }
schemes:
  SGGS:
    build:
      targets: { SGGS: all }
    test:
      targets: [SGGSTests, SGGSUITests]
      gatherCoverageData: false
